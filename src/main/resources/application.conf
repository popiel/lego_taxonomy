akka.http.parsing.cookie-parsing-mode = raw
akka.http.server.request-timeout = 60s

lego-taxonomy.web {
  route-request = 30s
  data-ask = 10s
  process-ask = 20s
  image-wait = 10s
  image-retry-after = 2s
  image-negative-ttl = 24h
}

lego-taxonomy.service {
  lookup-ask = 5s
  rebrickable-ask = 1s
  brickset-ask = 90s
  image-ask = 3s
}

lego-taxonomy.scheduled {
  rebrickable-fetch = 30m
  batch-probe = 2m
}
